[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cda-unet"
version = "0.1.0"
description = "Conditional Dynamic Adapter U-Net for automated cytometric gating"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Intelligent Medical Research Group"}]
dependencies = [
  "torch>=2.2,<3",
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "opencv-python-headless>=4.8",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
cda-unet = "cda_unet.cli:main"

[project.urls]
Repository = "https://github.com/Intelligent-Medical-Research-Group/CDA-UNet"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
